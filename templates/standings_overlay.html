<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="10">
  <title>Standings Overlay</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #000; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3vh 3vw;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    table {
      width: 100%;
      height: 94vh;
      border: 4px solid #fff;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      background: #171a22;
      font-size: clamp(12px, 2.1vh, 24px);
    }
    th, td {
      padding: clamp(4px, 1.1vh, 12px) clamp(6px, 1vw, 16px);
      border-right: 1px solid #596170;
      border-bottom: 1px solid #596170;
      text-align: left;
      overflow-wrap: anywhere;
    }
    th:last-child, td:last-child { border-right: 0; }
    tbody tr:last-child td { border-bottom: 0; }
    th {
      background: #303746;
      font-weight: 700;
    }
    tbody tr:nth-child(even) { background: #242a36; }
    .rank { width: 9%; }
    .bot { width: 55%; }
    .record { width: 18%; }
    .stat { width: 6%; text-align: center; }
    .bot-name { font-weight: 700; }
    @media (max-width: 600px) {
      body { padding: 2vh 2vw; }
      table { height: 96vh; font-size: clamp(10px, 1.8vh, 16px); }
      th, td { padding: 3px 4px; }
      .rank { width: 10%; }
      .bot { width: 48%; }
      .record { width: 20%; }
      .stat { width: 7.3%; }
    }
  </style>
</head>
<body>
  <table aria-label="Group stage standings">
    <thead>
      <tr>
        <th class="rank">Rank</th>
        <th class="bot">Bot</th>
        <th class="record">Record</th>
        <th class="stat">TO</th>
        <th class="stat">KO</th>
        <th class="stat">JD</th>
      </tr>
    </thead>
    <tbody>
      {% for stat in standings %}
        <tr>
          <td>{{ loop.index }}</td>
          <td class="bot-name">{{ stat.team.display_name }}</td>
          <td>{{ stat.record }}</td>
          <td class="stat">{{ stat.to }}</td>
          <td class="stat">{{ stat.ko }}</td>
          <td class="stat">{{ stat.jd }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
