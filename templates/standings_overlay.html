<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standings Overlay</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #000; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3vh 3vw;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .standings-window {
      width: 100%;
      height: 94vh;
      overflow-y: auto;
      border: 4px solid #fff;
      scrollbar-width: none;
    }
    .standings-window::-webkit-scrollbar { display: none; }
    table {
      width: 100%;
      height: auto;
      border-collapse: separate;
      border-spacing: 0;
      table-layout: fixed;
      background: #171a22;
      font-size: clamp(48px, 8.4vh, 96px);
    }
    th, td {
      padding: clamp(4px, 1.1vh, 12px) clamp(6px, 1vw, 16px);
      border-right: 1px solid #596170;
      border-bottom: 1px solid #596170;
      text-align: left;
      overflow-wrap: anywhere;
    }
    th:last-child, td:last-child { border-right: 0; }
    tbody tr:last-child td { border-bottom: 0; }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #303746;
      font-weight: 700;
    }
    tbody tr:nth-child(even) { background: #242a36; }
    .rank { width: 9%; }
    .bot { width: 55%; }
    .record { width: 18%; }
    .stat { width: 6%; text-align: center; }
    .bot-name { font-weight: 700; }
    @media (max-width: 600px) {
      body { padding: 2vh 2vw; }
      .standings-window { height: 96vh; }
      table { font-size: clamp(40px, 7.2vh, 64px); }
      th, td { padding: 3px 4px; }
      .rank { width: 10%; }
      .bot { width: 48%; }
      .record { width: 20%; }
      .stat { width: 7.3%; }
    }
  </style>
</head>
<body>
  <main class="standings-window" aria-label="Scrolling group stage standings">
    <table aria-label="Group stage standings">
      <thead>
        <tr>
          <th class="rank">Rank</th>
          <th class="bot">Bot</th>
          <th class="record">Record</th>
          <th class="stat">TO</th>
          <th class="stat">KO</th>
          <th class="stat">JD</th>
        </tr>
      </thead>
      <tbody>
        {% for stat in standings %}
          <tr>
            <td>{{ loop.index }}</td>
            <td class="bot-name">{{ stat.team.display_name }}</td>
            <td>{{ stat.record }}</td>
            <td class="stat">{{ stat.to }}</td>
            <td class="stat">{{ stat.ko }}</td>
            <td class="stat">{{ stat.jd }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </main>
  <script>
    const standingsWindow = document.querySelector('.standings-window');
    let previousUpdate = performance.now();
    let pauseUntil = 0;
    let scrollDirection = 1;
    const scrollSpeed = 0.0075;

    function scrollStandings() {
      const timestamp = performance.now();
      const elapsed = Math.min(timestamp - previousUpdate, 100);
      previousUpdate = timestamp;
      const maxScroll = standingsWindow.scrollHeight - standingsWindow.clientHeight;
      if (maxScroll <= 0) {
        return;
      }
      if (timestamp < pauseUntil) return;

      const nextScroll = standingsWindow.scrollTop + scrollDirection * elapsed * scrollSpeed;
      if (scrollDirection > 0 && nextScroll >= maxScroll) {
        standingsWindow.scrollTop = maxScroll;
        scrollDirection = -1;
        pauseUntil = timestamp + 1200;
      } else if (scrollDirection < 0 && nextScroll <= 0) {
        standingsWindow.scrollTop = 0;
        scrollDirection = 1;
        pauseUntil = timestamp + 1200;
      } else {
        standingsWindow.scrollTop = nextScroll;
      }
    }

    async function refreshStandings() {
      try {
        const response = await fetch(window.location.href, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Standings refresh failed: ${response.status}`);
        const refreshedPage = new DOMParser().parseFromString(await response.text(), 'text/html');
        const refreshedBody = refreshedPage.querySelector('.standings-window tbody');
        if (!refreshedBody) throw new Error('Standings response did not contain a table body.');
        standingsWindow.querySelector('tbody').innerHTML = refreshedBody.innerHTML;
      } catch (error) {
        console.error('Could not refresh streaming standings.', error);
      }
    }

    window.setInterval(scrollStandings, 50);
    window.setInterval(refreshStandings, 10000);
  </script>
</body>
</html>
